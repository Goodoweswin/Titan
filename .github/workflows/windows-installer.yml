name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: ["codex/windows-installer"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Configure Rust
        shell: pwsh
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Build and test Windows x64 installer
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Titan-WB-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
