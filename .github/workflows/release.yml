name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.platform == 'windows-x64' && 'x64' || 'arm64' }}
      - name: Read application version
        shell: bash
        run: node -p "'APP_VERSION=' + require('./package.json').version" >> "$GITHUB_ENV"
      - name: Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          ./packaging/build_windows.ps1
          $engine = 'src-tauri/engine/wb-engine/wb-engine.exe'
          .venv/Scripts/python.exe scripts/verify_lane_release.py --binary $engine --output artifacts/lane-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged lane verification failed' }
          .venv/Scripts/python.exe scripts/verify_publication_release.py $engine artifacts/publication-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged publication verification failed' }
          .venv/Scripts/python.exe scripts/verify_rotation_release.py --binary $engine --output artifacts/rotation-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged rotation verification failed' }
          .venv/Scripts/python.exe scripts/verify_wb_release.py --binary $engine --output artifacts/wb-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged WB assembly verification failed' }
          .venv/Scripts/python.exe scripts/verify_if_engine.py --engine $engine --output artifacts/if-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged IF verification failed' }
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' 'dist-release/Titan-${{ env.APP_VERSION }}-windows-x64-setup.exe'
          .venv/Scripts/python.exe scripts/package_notices.py dist-release/Titan-${{ env.APP_VERSION }}-windows-x64-third-party.zip
      - name: macOS build and bundled verification
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          npm ci
          .venv/bin/python -m pytest -q
          npm test
          mkdir -p artifacts dist-release
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > artifacts/cargo-metadata.json
          .venv/bin/python scripts/collect_notices.py
          .venv/bin/python packaging/build_engine.py
          npm run desktop:build -- --target aarch64-apple-darwin --bundles app,dmg
          .venv/bin/python scripts/verify_release.py --app 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app' --output artifacts/release-verification
          ENGINE='src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app/Contents/Resources/engine/wb-engine/wb-engine'
          .venv/bin/python scripts/verify_lane_release.py --binary "$ENGINE" --output artifacts/lane-verification
          .venv/bin/python scripts/verify_publication_release.py "$ENGINE" artifacts/publication-verification
          .venv/bin/python scripts/verify_rotation_release.py --binary "$ENGINE" --output artifacts/rotation-verification
          .venv/bin/python scripts/verify_wb_release.py --binary "$ENGINE" --output artifacts/wb-verification
          .venv/bin/python scripts/verify_if_engine.py --engine "$ENGINE" --output artifacts/if-verification
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-release/Titan-${{ env.APP_VERSION }}-macos-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app' dist-release/Titan-${{ env.APP_VERSION }}-macos-arm64.app.zip
          .venv/bin/python scripts/package_notices.py dist-release/Titan-${{ env.APP_VERSION }}-macos-arm64-third-party.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}
          path: |
            artifacts/**/*verification*.json
            artifacts/**/engine-stderr.log
            artifacts/**/engine.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Checksums and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist-release/* --prerelease --title "Titan $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
