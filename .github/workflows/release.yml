name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.platform == 'windows-x64' && 'x64' || 'arm64' }}
      - name: Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          ./packaging/build_windows.ps1
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' 'dist-release/Titan-WB-0.1.0-windows-x64-setup.exe'
          .venv/Scripts/python.exe scripts/package_notices.py dist-release/Titan-WB-0.1.0-windows-x64-third-party.zip
      - name: macOS build and bundled verification
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          npm ci
          .venv/bin/python -m pytest -q
          npm test
          mkdir -p artifacts dist-release
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > artifacts/cargo-metadata.json
          .venv/bin/python scripts/collect_notices.py
          .venv/bin/python packaging/build_engine.py
          npm run desktop:build -- --target aarch64-apple-darwin --bundles app,dmg
          .venv/bin/python scripts/verify_release.py --app 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan WB.app' --output artifacts/release-verification
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-release/Titan-WB-0.1.0-macos-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan WB.app' dist-release/Titan-WB-0.1.0-macos-arm64.app.zip
          .venv/bin/python scripts/package_notices.py dist-release/Titan-WB-0.1.0-macos-arm64-third-party.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Checksums and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist-release/* --prerelease --title "Titan WB $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
