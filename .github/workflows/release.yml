name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'Goodoweswin/Titan'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      TITAN_ACCOUNTS_ISSUER: https://121.40.43.188
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.platform == 'windows-x64' && 'x64' || 'arm64' }}
      - name: Read application version
        shell: bash
        run: node -p "'APP_VERSION=' + require('./package.json').version" >> "$GITHUB_ENV"
      - name: Prepare Windows dependencies and engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          ./packaging/build_windows.ps1 -PrepareOnly
      - name: Build signed Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          npm run desktop:build -- --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.beta.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS build failed' }
      - name: Verify Windows bundle and collect release assets
        id: windows_release_assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { throw 'Native account tests failed' }
          $nativeVersion = (Get-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/titan-wb.exe').VersionInfo.ProductVersion
          .venv/Scripts/python.exe scripts/verify_accounts_release.py --binary src-tauri/target/x86_64-pc-windows-msvc/release/titan-wb.exe --issuer $env:TITAN_ACCOUNTS_ISSUER --platform windows-x64 --native-version $nativeVersion --output artifacts/accounts-release-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Compiled account issuer verification failed' }
          $engine = 'src-tauri/engine/wb-engine/wb-engine.exe'
          .venv/Scripts/python.exe scripts/verify_lane_release.py --binary $engine --output artifacts/lane-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged lane verification failed' }
          .venv/Scripts/python.exe scripts/verify_publication_release.py $engine artifacts/publication-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged publication verification failed' }
          .venv/Scripts/python.exe scripts/verify_rotation_release.py --binary $engine --output artifacts/rotation-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged rotation verification failed' }
          .venv/Scripts/python.exe scripts/verify_wb_release.py --binary $engine --output artifacts/wb-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged WB assembly verification failed' }
          .venv/Scripts/python.exe scripts/verify_if_engine.py --engine $engine --output artifacts/if-verification
          if ($LASTEXITCODE -ne 0) { throw 'Packaged IF verification failed' }
          .venv/Scripts/python.exe scripts/verify_stats_engine.py $engine > artifacts/stats-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged statistics verification failed' }
          .venv/Scripts/python.exe scripts/verify_stats_sources.py $engine > artifacts/stats-sources-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged statistics source verification failed' }
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $installer = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          $destination = "dist-release/Titan-$($env:APP_VERSION)-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installer[0].FullName -Destination $destination
          Copy-Item -LiteralPath ($installer[0].FullName + '.sig') -Destination ($destination + '.sig')
          .venv/Scripts/python.exe scripts/package_notices.py dist-release/Titan-${{ env.APP_VERSION }}-windows-x64-third-party.zip
      - name: Exercise the Windows updater
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qa = Join-Path $env:RUNNER_TEMP 'titan-updater-qa'
          New-Item -ItemType Directory -Path $qa | Out-Null
          $key = Join-Path $qa 'update.key'
          npm run tauri -- signer generate --ci --write-keys $key *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Test key generation failed' }
          $candidate = Join-Path $qa 'Titan-update.exe'
          Copy-Item "dist-release/Titan-$($env:APP_VERSION)-windows-x64-setup.exe" $candidate
          npm run tauri -- signer sign --private-key-path $key --app-version $env:APP_VERSION $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Test package signing failed' }
          $config = Join-Path $qa 'starter.json'
          @{
            version = '0.0.1'
            plugins = @{updater = @{
              pubkey = (Get-Content -Raw ($key + '.pub')).Trim()
              endpoints = @('http://127.0.0.1:18451/beta.json')
              dangerousInsecureTransportProtocol = $true
              requireSignedVersion = $true
            }}
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM $config
          npm run desktop:build -- --target x86_64-pc-windows-msvc --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Updater starter build failed' }
          $starter = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_0.0.1_*-setup.exe'
          $installDir = Join-Path $qa 'Titan'
          $process = Start-Process $starter.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Updater starter installation failed' }
          node scripts/verify_windows_update.mjs (Join-Path $installDir 'titan-wb.exe') $candidate ($candidate + '.sig') $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater check failed' }
      - name: Prepare macOS dependencies and engine
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          npm ci
          .venv/bin/python -m pytest -q
          npm test
          mkdir -p artifacts dist-release
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > artifacts/cargo-metadata.json
          .venv/bin/python scripts/collect_notices.py
          .venv/bin/python packaging/build_engine.py
      - name: Build signed macOS installer and update archive
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          npm run desktop:build -- --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.beta.conf.json
      - name: Verify macOS bundle and collect release assets
        if: runner.os == 'macOS'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app/Contents/Info.plist)" = "$APP_VERSION"
          .venv/bin/python scripts/verify_accounts_release.py --binary 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app/Contents/MacOS/titan-wb' --issuer "$TITAN_ACCOUNTS_ISSUER" --platform macos-arm64 --output artifacts/accounts-release-verification.json
          .venv/bin/python scripts/verify_release.py --app 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app' --output artifacts/release-verification
          ENGINE='src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app/Contents/Resources/engine/wb-engine/wb-engine'
          .venv/bin/python scripts/verify_lane_release.py --binary "$ENGINE" --output artifacts/lane-verification
          .venv/bin/python scripts/verify_publication_release.py "$ENGINE" artifacts/publication-verification
          .venv/bin/python scripts/verify_rotation_release.py --binary "$ENGINE" --output artifacts/rotation-verification
          .venv/bin/python scripts/verify_wb_release.py --binary "$ENGINE" --output artifacts/wb-verification
          .venv/bin/python scripts/verify_if_engine.py --engine "$ENGINE" --output artifacts/if-verification
          .venv/bin/python scripts/verify_stats_engine.py "$ENGINE" > artifacts/stats-verification.json
          .venv/bin/python scripts/verify_stats_sources.py "$ENGINE" > artifacts/stats-sources-verification.json
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-release/Titan-${{ env.APP_VERSION }}-macos-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Titan.app' dist-release/Titan-${{ env.APP_VERSION }}-macos-arm64.app.zip
          mac_bundle=src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          cp "$mac_bundle/Titan.app.tar.gz" "dist-release/Titan-$APP_VERSION-macos-arm64.app.tar.gz"
          cp "$mac_bundle/Titan.app.tar.gz.sig" "dist-release/Titan-$APP_VERSION-macos-arm64.app.tar.gz.sig"
          .venv/bin/python scripts/package_notices.py dist-release/Titan-${{ env.APP_VERSION }}-macos-arm64-third-party.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}
          path: |
            artifacts/**/*verification*.json
            artifacts/**/engine-stderr.log
            artifacts/**/engine.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() || (runner.os == 'Windows' && steps.windows_release_assets.conclusion == 'success')
        with:
          name: release-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: titan-beta-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Prepare and validate the Beta update manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          previous=()
          if git ls-remote --exit-code origin refs/heads/updates >/dev/null; then
            git fetch --no-tags origin refs/heads/updates
            git show FETCH_HEAD:beta.json > "$RUNNER_TEMP/previous-beta.json"
            previous=(--previous "$RUNNER_TEMP/previous-beta.json")
            echo "FEED_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          else
            test "$?" -eq 2
          fi
          python scripts/prepare_beta_update.py --release-dir dist-release \
            --version "$(node -p 'require("./package.json").version')" --tag "$GITHUB_REF_NAME" \
            --config src-tauri/tauri.beta.conf.json --notes "docs/releases/$GITHUB_REF_NAME.md" \
            "${previous[@]}" --output "$RUNNER_TEMP/beta.json"
      - name: Publish the prerelease and verify the downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist-release && sha256sum * > SHA256SUMS.txt)
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [ "$draft" = true ]; then
              gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* --verify-tag --draft --prerelease \
              --title "Titan $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
            draft=true
          fi
          download_dir=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --dir "$download_dir"
          diff <(cd dist-release && ls -1) <(cd "$download_dir" && ls -1)
          cmp dist-release/SHA256SUMS.txt "$download_dir/SHA256SUMS.txt"
          (cd "$download_dir" && sha256sum -c SHA256SUMS.txt)
          if [ "$draft" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          fi
          python -c 'import json, sys; print(*(p["url"] for p in json.load(open(sys.argv[1]))["platforms"].values()), sep="\n")' "$RUNNER_TEMP/beta.json" |
            while IFS= read -r url; do
              curl --fail --silent --show-error --location --head "$url" > /dev/null
            done
      - name: Advance the public Beta update feed
        run: |
          if [ -n "${FEED_BASE:-}" ]; then
            git switch --detach "$FEED_BASE"
          else
            git switch --orphan updates
          fi
          cp "$RUNNER_TEMP/beta.json" beta.json
          git add beta.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish Titan Beta update $GITHUB_REF_NAME"
          git push origin HEAD:refs/heads/updates
