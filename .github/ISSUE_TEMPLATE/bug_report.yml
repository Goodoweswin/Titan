name: 问题反馈
description: 报告安装、操作或定量问题
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: 系统与版本
      description: 操作系统、CPU 架构、Titan WB 版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 说明输入、操作、预期与实际结果；尽量用合成数据复现。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充信息
      description: 请勿上传敏感或无共享许可的实验数据。
