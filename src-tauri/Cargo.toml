[package]
name = "titan-wb"
version = "0.4.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Goodoweswin/Titan"

[lib]
name = "titan_wb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
sha2 = "0.10"
subtle = "2.6"
url = "2"
zeroize = { version = "1", features = ["derive"] }
open = "5.3"

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
