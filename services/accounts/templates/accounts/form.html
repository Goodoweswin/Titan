<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Titan</title><style>body{font:17px system-ui,sans-serif;max-width:440px;margin:8vh auto;padding:24px;color:#192329;background:#f5f6f5}h1{font-size:28px}form{display:grid;gap:12px}input{box-sizing:border-box;display:block;width:100%;padding:10px;margin-top:6px;font:inherit}button{font:inherit;background:#243d38;color:white;border:0;border-radius:7px;padding:12px;cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}a{color:#285f52}.errorlist{color:#a32424;padding-left:20px}</style></head><body><main><p>Titan 账户</p><h1>{{ title }}</h1>{% if managed %}<p>账号由管理员开通；密码问题请联系管理员。</p>{% endif %}{% if message %}<p role="status">{{ message }}</p>{% endif %}{% if form or title == '确认邮箱' %}<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">继续</button></form>{% endif %}<nav><a href="/login?next={{ next|urlencode }}">登录</a>{% if not managed %}<a href="/register?next={{ next|urlencode }}">注册账户</a><a href="/recover?next={{ next|urlencode }}">找回密码</a><a href="/resend?next={{ next|urlencode }}">重新发送验证邮件</a>{% endif %}</nav></main></body></html>
